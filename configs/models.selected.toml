# 收敛后的模型清单。此文件表达选择，不包含密钥或远端 MCP 工具参数。
# 统一参数入口见 configs/model_params.example.json。

[[models]]
id = "yolox"
role = "production_detector"
enabled = true
repository = "https://github.com/Megvii-BaseDetection/YOLOX"
license = "code: Apache-2.0; verify pretrained-weight terms separately"
reason = "PyTorch 固定类别检测、多卡训练、TensorRT/TorchScript 与 ByteTrack 路径成熟"

[[models]]
id = "yolo-world"
role = "zero_shot_open_vocabulary_probe"
enabled = true
repository = "https://github.com/AILab-CVC/YOLO-World"
license = "GPL-3.0 repository; production use in closed systems requires compliance review or commercial licensing"
reason = "适合不确定实体名称时做候选对象发现、零样本开放词表测试、辅助标注和低频旁路复核"

[[models]]
id = "pet-dino"
role = "zero_shot_visual_prompt_probe"
enabled = true
repository = "https://github.com/fuweifuvtoo/PET_DINO"
license = "Apache-2.0"
reason = "适合用少量视觉样例发现同类工装、夹具、线束、原料和半成品"

[[models]]
id = "grounding-dino"
role = "zero_shot_text_prompt_annotation_helper"
enabled = true
repository = "https://github.com/IDEA-Research/GroundingDINO"
weights = "IDEA-Research/grounding-dino-tiny"
license = "Apache-2.0"
reason = "用于文本提示类别探索和半自动标注，不作为生产逐帧唯一主链"

[[models]]
id = "owlv2"
role = "zero_shot_text_and_image_guided_baseline"
enabled = true
repository = "https://huggingface.co/google/owlv2-base-patch16-ensemble"
license = "verify model card/license metadata before production use"
reason = "标准零样本文本检测基线，也可测试 image-guided detection，适合和 Grounding DINO / YOLO-World / PET-DINO 对照"

[[models]]
id = "bytetrack"
role = "optional_tracker"
enabled = false
repository = "https://github.com/FoundationVision/ByteTrack"
license = "MIT"
reason = "需要轨迹、计数或短时漏检平滑时在检测器后串联"

[[models]]
id = "omdet-turbo"
role = "open_vocabulary_backup"
enabled = false
repository = "https://github.com/om-ai-lab/OmDet"
license = "Apache-2.0"
reason = "当 YOLO-World 在现场效果或速度不满足时再纳入实测"

[[models]]
id = "sam2"
role = "optional_segmentation"
enabled = false
repository = "https://github.com/facebookresearch/sam2"
license = "Apache-2.0"
reason = "当前只要求边界框；需要像素级轮廓或辅助标注时再启用"
